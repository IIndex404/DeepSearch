name: deepsearch-ragflow
services:
  mysql:
    image: mysql:8.0.39
    container_name: deepsearch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --max-connections=200
    - --innodb-buffer-pool-size=128M
    - --max-allowed-packet=256M
    ports:
    - 127.0.0.1:3306:3306
    volumes:
    - ./data/mysql:/var/lib/mysql
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: deepsearch-es
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    ports:
    - 127.0.0.1:1200:9200
    volumes:
    - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --fail -u "elastic:$$ELASTIC_PASSWORD" http://127.0.0.1:9200/_cluster/health
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1536m
    restart: unless-stopped
  redis:
    image: valkey/valkey:8
    container_name: deepsearch-redis
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --maxmemory
    - 128mb
    - --maxmemory-policy
    - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
    - ./data/redis:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?Set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD in .env}
    command: server /data --console-address :9001
    volumes:
    - ./data/minio:/data
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    restart: unless-stopped
  ragflow:
    image: infiniflow/ragflow:v0.24.0
    container_name: deepsearch-ragflow
    depends_on:
      minio:
        condition: service_started
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis:
        condition: service_healthy
      tei:
        condition: service_started
    ports:
    - 127.0.0.1:8080:80
    - 127.0.0.1:9380:9380
    env_file: .env
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ./data/logs:/ragflow/logs
    - ./data/models:/root/.cache/huggingface
    - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf:ro
    - ./nginx/proxy.conf:/etc/nginx/proxy.conf:ro
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    - ./entrypoint.sh:/ragflow/entrypoint.sh:ro
    mem_limit: 4096m
    restart: unless-stopped
    command:
    - --disable-datasync
    - --workers=1
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:9380/v1/user/login/channels
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: deepsearch-embedding
    command:
    - --model-id
    - BAAI/bge-small-zh-v1.5
    - --port
    - '80'
    - --max-client-batch-size
    - '16'
    - --auto-truncate
    volumes:
    - ./data/embedding_cache:/data
    ports:
    - 127.0.0.1:6380:80
    environment:
      OMP_NUM_THREADS: '2'
      RAYON_NUM_THREADS: '2'
    mem_limit: 1536m
    restart: unless-stopped
